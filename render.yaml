services:
  # 1. Python FastAPI Backend Service
  - type: web
    name: incubrix-backend
    env: python
    repo: https://github.com
    branch: main
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port 10000
    envVars:
      - key: FOOTAGE_PROVIDER
        value: mock
      - key: RENDER_PRESET
        value: development
      - key: MIN_RELEVANCE_THRESHOLD
        value: "0.20"

  # 2. React/Vite Frontend Static Site
  - type: web
    name: incubrix-frontend
    env: static
    repo: https://github.com
    branch: main
    rootDir: frontend
    buildCommand: npm install && npm run build
    publishDir: dist
